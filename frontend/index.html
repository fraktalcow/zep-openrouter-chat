<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zep OpenRouter Agent</title>
    <meta
      name="description"
      content="Open agent interface with tool calls and knowledge graph visualization"
    />

    <!-- Vis-Network -->
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>

    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google Fonts: JetBrains Mono is closest to Hermit available on CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <div class="logo">Zep OpenRouter Agent</div>
        <div class="header-controls" style="display: flex; gap: 0.5rem">
          <button class="secondary" onclick="openSchemaModal()">
            Edit Schema
          </button>
          <button onclick="initSession(true)">New Session</button>
        </div>
      </header>

      <!-- Panel 1: Configuration -->
      <div class="panel config-panel">
        <div class="panel-header">
          <span>Configuration</span>
        </div>
        <div class="panel-content">
          <!-- OpenRouter API SECTION -->
          <div class="config-section">
            <div class="section-header">OpenRouter API</div>

            <div class="control-group">
              <label class="toggle-switch">
                <input type="checkbox" id="ai-toggle" checked />
                <span class="slider"></span>
                <span>Enable AI Generation</span>
              </label>
            </div>

            <div class="input-group">
              <label>Model</label>
              <select id="model-select">
                <option value="meta-llama/llama-3.2-3b-instruct:free">
                  Loading available models...
                </option>
              </select>
            </div>

            <div style="display: flex; gap: 0.5rem">
              <div class="input-group" style="flex: 1">
                <label>Temperature (<span id="temp-val">0.7</span>)</label>
                <input
                  type="range"
                  id="temp-input"
                  min="0"
                  max="2"
                  step="0.1"
                  value="0.7"
                  oninput="document.getElementById('temp-val').textContent = this.value"
                  style="width: 100%; accent-color: var(--ctp-lavender)"
                />
              </div>
              <div class="input-group" style="flex: 1">
                <label>Max Tokens</label>
                <input
                  type="number"
                  id="max-tokens-input"
                  value="1024"
                  min="1"
                  max="100000"
                />
              </div>
            </div>
          </div>

          <hr class="divider" />

          <!-- GRAPH SOURCE & RAG SECTION -->
          <div class="config-section">
            <div class="section-header flex">
              <span>Zep Memory</span>
              <label class="toggle-switch" style="margin: 0">
                <input
                  type="checkbox"
                  id="zep-toggle"
                  checked
                />
                <span class="slider"></span>
              </label>
            </div>

            <div id="zep-settings">
              <div style="display: flex; gap: 0.5rem">
                <div class="input-group" style="flex: 1">
                  <label>First Name</label>
                  <input type="text" id="first-name" placeholder="First name" />
                </div>
                <div class="input-group" style="flex: 1">
                  <label>Last Name</label>
                  <input type="text" id="last-name" placeholder="Last name" />
                </div>
              </div>

              <div class="input-group">
                <label>Traits</label>
                <textarea
                  id="traits-input"
                  style="min-height: 40px"
                  placeholder="e.g. Curious, detail oriented."
                ></textarea>
              </div>

              <div class="input-group">
                <label>Preferences</label>
                <textarea
                  id="preferences-input"
                  style="min-height: 40px"
                  placeholder="e.g. Enjoys structured, actionable answers."
                ></textarea>
              </div>

              <div class="input-group">
                <label>Business Data</label>
                <textarea
                  id="business-data-input"
                  style="min-height: 40px"
                  placeholder="Add business context here"
                ></textarea>
              </div>

              <div style="margin-top: 0.5rem">
                <label style="margin-bottom: 0.5rem; display: block"
                  >Memory Modules</label
                >
                <div style="display: flex; gap: 1.5rem">
                  <label class="toggle-switch">
                    <input type="checkbox" id="memory-toggle" checked />
                    <span class="slider"></span>
                    <span>Mem</span>
                  </label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="retrieval-toggle" checked />
                    <span class="slider"></span>
                    <span>Graph</span>
                  </label>
                </div>
              </div>
            </div>

            <div id="zep-disabled-msg" class="disabled-msg" style="display: none">
              Zep memory disabled. Chat will use RAG only.
            </div>
          </div>

          <hr class="divider" />

          <!-- RAG SECTION (OpenRouter Embeddings) -->
          <div class="config-section">
            <div class="section-header flex">
              <span>RAG (OpenRouter)</span>
              <label class="toggle-switch" style="margin: 0">
                <input type="checkbox" id="rag-toggle" />
                <span class="slider"></span>
              </label>
            </div>

            <div id="rag-settings" style="display: none">
              <div class="input-group">
                <label>Embedding Model</label>
                <select id="embedding-model-select">
                  <option value="openai/text-embedding-3-small">text-embedding-3-small</option>
                </select>
              </div>

              <div class="input-group">
                <label>Document Text</label>
                <textarea
                  id="document-text-input"
                  class="mono-text"
                  style="min-height: 60px"
                  placeholder="Paste document text to ingest..."
                ></textarea>
              </div>

              <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem">
                <button id="ingest-btn" class="full-width">Ingest</button>
                <button id="clear-rag-btn" class="secondary">Clear</button>
              </div>

              <div id="rag-status" class="status-text" style="margin-top: 0.5rem"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 2: Graph -->
      <div class="panel graph-panel">
        <div class="panel-header">
          <span>Graph</span>
          <div class="flex gap-sm">
            <button class="secondary btn-sm" onclick="refreshGraph()">
              Refresh
            </button>
            <button class="secondary btn-sm" onclick="resetZoom()">
              Reset
            </button>
          </div>
        </div>
        <div
          class="panel-content"
          style="padding: 0; flex-direction: column; display: flex"
        >
          <div id="graph-container" style="height: 100%; width: 100%"></div>
          <div class="graph-stats">
            <div class="stat-item">
              <div id="node-count" class="stat-value">0</div>
              <div class="stat-label">Nodes</div>
            </div>
            <div class="stat-item">
              <div id="edge-count" class="stat-value">0</div>
              <div class="stat-label">Edges</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 3: Chat -->
      <div class="panel chat-panel">
        <div class="panel-header">
          <span>Chat</span>
          <span
            id="active-model-display"
            style="
              font-size: 0.7rem;
              color: var(--ctp-subtext0);
              margin-left: auto;
              margin-right: 1rem;
              max-width: 200px;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            "
          ></span>
          <span
            id="session-badge"
            style="color: var(--ctp-green); font-size: 0.75rem"
            >ID: NULL</span
          >
        </div>
        <div class="panel-content">
          <div id="chat-box">
            <div
              style="
                text-align: center;
                color: var(--ctp-surface2);
                margin-top: 50%;
              "
            >
              <p>System Ready.<br />Start the conversation.</p>
            </div>
          </div>
          <div class="input-area">
            <div class="input-wrapper" style="position: relative">
              <input
                type="text"
                id="message-input"
                placeholder="Type your message..."
                autocomplete="off"
              />
              <div
                id="tool-palette"
                class="tool-palette"
                style="display: none"
              ></div>
            </div>
            <button onclick="sendMessage()" id="send-btn">SEND</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="schema-modal">
      <div class="modal">
        <div class="modal-header">
          <span style="font-weight: 700">Edit Schema</span>
          <button
            class="secondary"
            onclick="closeSchemaModal()"
            style="border: none; padding: 0; color: var(--ctp-red)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <p
            style="
              margin-bottom: 1rem;
              color: var(--ctp-subtext0);
              font-size: 0.85rem;
            "
          >
            Modifying ontology definitions...
          </p>
          <textarea
            id="schema-editor"
            style="height: 300px; font-size: 0.85rem"
          ></textarea>
        </div>
        <div class="modal-footer">
          <button class="secondary" onclick="closeSchemaModal()">CANCEL</button>
          <button onclick="saveSchema()">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
