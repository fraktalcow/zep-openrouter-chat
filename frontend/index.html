<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zep OpenRouter Agent</title>
    <meta
      name="description"
      content="Chat interface with memory and knowledge graph"
    />

    <!-- Vis-Network -->
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <div class="logo">Zep OpenRouter Agent</div>
        <div class="header-controls" style="display: flex; gap: 0.5rem">
          <button class="secondary" onclick="openSessionsModal()">
            📋 Sessions
          </button>
          <button onclick="initSession(true)">New Session</button>
        </div>
      </header>

      <!-- Panel 1: Configuration -->
      <div class="panel config-panel">
        <div class="panel-header"><span>Configuration</span></div>
        <div class="panel-content">
          <!-- OpenRouter API -->
          <div class="config-section">
            <div class="section-header">OpenRouter API</div>
            <div class="control-group">
              <label class="toggle-switch">
                <input type="checkbox" id="ai-toggle" checked />
                <span class="slider"></span>
                <span>Enable AI</span>
              </label>
            </div>
            <div class="input-group">
              <label>Model</label>
              <select id="model-select">
                <option value="meta-llama/llama-3.2-3b-instruct:free">
                  Loading...
                </option>
              </select>
            </div>
            <div style="display: flex; gap: 0.5rem">
              <div class="input-group" style="flex: 1">
                <label>Temp (<span id="temp-val">0.7</span>)</label>
                <input
                  type="range"
                  id="temp-input"
                  min="0"
                  max="2"
                  step="0.1"
                  value="0.7"
                  oninput="document.getElementById('temp-val').textContent = this.value"
                  style="width: 100%; accent-color: var(--ctp-lavender)"
                />
              </div>
              <div class="input-group" style="flex: 1">
                <label>Max Tokens</label>
                <input
                  type="number"
                  id="max-tokens-input"
                  value="1024"
                  min="1"
                  max="100000"
                />
              </div>
            </div>
          </div>

          <hr class="divider" />

          <!-- Zep Memory -->
          <div class="config-section">
            <div class="section-header flex">
              <span>Zep Memory</span>
              <label class="toggle-switch" style="margin: 0">
                <input type="checkbox" id="zep-toggle" checked />
                <span class="slider"></span>
              </label>
            </div>
            <div id="zep-settings">
              <div style="display: flex; gap: 0.5rem">
                <div class="input-group" style="flex: 1">
                  <label>First Name</label>
                  <input type="text" id="first-name" placeholder="First name" />
                </div>
                <div class="input-group" style="flex: 1">
                  <label>Last Name</label>
                  <input type="text" id="last-name" placeholder="Last name" />
                </div>
              </div>
              <div style="margin-top: 0.5rem">
                <label style="margin-bottom: 0.5rem; display: block"
                  >Memory Modules</label
                >
                <div style="display: flex; gap: 1.5rem">
                  <label class="toggle-switch">
                    <input type="checkbox" id="memory-toggle" checked />
                    <span class="slider"></span>
                    <span>Mem</span>
                  </label>
                  <label class="toggle-switch">
                    <input type="checkbox" id="retrieval-toggle" checked />
                    <span class="slider"></span>
                    <span>Graph</span>
                  </label>
                </div>
              </div>
            </div>
            <div
              id="zep-disabled-msg"
              class="disabled-msg"
              style="display: none"
            >
              Zep memory disabled.
            </div>
          </div>

          <hr class="divider" />
        </div>
      </div>

      <!-- Panel 2: Graph -->
      <div class="panel graph-panel">
        <div class="panel-header">
          <span>Graph</span>
          <div class="flex gap-sm">
            <button class="secondary btn-sm" onclick="refreshGraph()">
              Refresh
            </button>
            <button class="secondary btn-sm" onclick="resetZoom()">
              Reset
            </button>
          </div>
        </div>
        <div
          class="panel-content"
          style="padding: 0; flex-direction: column; display: flex"
        >
          <div id="graph-container" style="height: 100%; width: 100%"></div>
          <div class="graph-stats">
            <div class="stat-item">
              <div id="node-count" class="stat-value">0</div>
              <div class="stat-label">Nodes</div>
            </div>
            <div class="stat-item">
              <div id="edge-count" class="stat-value">0</div>
              <div class="stat-label">Edges</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel 3: Chat -->
      <div class="panel chat-panel">
        <div class="panel-header">
          <span>Chat</span>
          <span
            id="active-model-display"
            style="
              font-size: 0.7rem;
              color: var(--ctp-subtext0);
              margin-left: auto;
              margin-right: 1rem;
              max-width: 200px;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            "
          ></span>
          <span
            id="rag-indicator"
            style="
              font-size: 0.7rem;
              color: var(--ctp-teal);
              margin-right: 1rem;
              display: none;
            "
            title="RAG context available"
          >
            <i class="fa-solid fa-database"></i> RAG Active
          </span>
          <span
            id="session-badge"
            style="color: var(--ctp-green); font-size: 0.75rem"
            >ID: NULL</span
          >
        </div>
        <div class="panel-content">
          <div id="chat-box">
            <div
              style="
                text-align: center;
                color: var(--ctp-surface2);
                margin-top: 50%;
              "
            >
              <p>System Ready.<br />Start the conversation.</p>
            </div>
          </div>

          <!-- File Upload UI -->
          <div id="upload-area" class="ingest-area" style="display: none">
            <div style="text-align: center; margin-bottom: 1rem">
              <i class="fa-solid fa-file-arrow-up" style="font-size: 2rem; color: var(--ctp-lavender)"></i>
              <p style="margin: 0.5rem 0; color: var(--ctp-text); font-weight: 500">
                Add Document for Context
              </p>
              <p style="margin: 0; font-size: 0.75rem; color: var(--ctp-subtext0)">
                PDF, TXT, MD, DOCX
              </p>
            </div>
            <input
              type="file"
              id="file-input"
              accept=".pdf,.txt,.md,.markdown,.docx"
              style="display: none"
            />
            <div class="ingest-controls">
              <button id="select-file-btn" class="btn-sm">
                <i class="fa-solid fa-file"></i> Choose File
              </button>
              <button
                onclick="document.getElementById('upload-area').style.display='none'"
                class="secondary btn-sm"
              >
                Cancel
              </button>
            </div>
            <div id="upload-status" style="margin-top: 1rem; display: none; font-size: 0.85rem; color: var(--ctp-text)"></div>
          </div>

          <div class="input-area">
            <button
              class="icon-btn"
              id="upload-toggle-btn"
              title="Attach Document"
            >
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <div class="input-wrapper" style="position: relative; flex: 1">
              <input
                type="text"
                id="message-input"
                placeholder="Type your message..."
                autocomplete="off"
              />
            </div>
            <button onclick="sendMessage()" id="send-btn">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sessions Modal -->
    <div class="modal-overlay" id="sessions-modal">
      <div class="modal sessions-modal">
        <div class="modal-header">
          <span style="font-weight: 700">📋 Sessions</span>
          <button
            class="secondary"
            onclick="closeSessionsModal()"
            style="border: none; padding: 0; color: var(--ctp-red)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body sessions-modal-body" id="sessions-modal-content">
          <div class="sessions-loading">Loading sessions...</div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
