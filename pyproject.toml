[project]
name = "zep-openrouter-chat"
version = "0.2.0"
description = "Zep + OpenRouter + Pinecone Chat Application"
requires-python = ">=3.10"
dependencies = [
    "zep-cloud>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pinecone>=5.0.0",
    "pinecone-client>=6.0.0",
    "requests>=2.32.5",
    "python-multipart>=0.0.21",
    "pypdf>=6.5.0",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
