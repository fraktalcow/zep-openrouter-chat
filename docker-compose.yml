# PostgreSQL database for Zep Chat
# Usage: docker compose up -d
# Data persists in named volume 'zep-chat-pgdata'

services:
  postgres:
    image: postgres:16
    container_name: zep-chat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zep_chat
    ports:
      - "5432:5432"
    volumes:
      - zep-chat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zep_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  zep-chat-pgdata:
